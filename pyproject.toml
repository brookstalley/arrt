[project]
name = "arrt-governance"
version = "0.6.0"
description = "The repository's governance suite: the checks that read more than one project, plus repo-wide tool config."
requires-python = ">=3.12"
# `dotenv_values` reads this checkout's `.env` in the deployment-values guard,
# with the parser both planes load it through.
dependencies = ["python-dotenv"]

# There is no code at the root, only tests (`tests/preferences/test_file_organization.py`
# holds it so). This project exists so `uv run pytest` works here and so tool
# configuration has one home.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
    # Reads `.prawduct/project-state.yaml` in the artifact-manifest guard, which
    # checks a YAML document's structure and so parses it rather than grepping it.
    "pyyaml>=6",
]

[tool.black]
target-version = ["py312"]
line-length = 130
# Same plane boundary the ruff `extend-exclude` below draws, and it has to be
# drawn twice because black takes a REGEX against the root-relative path while
# ruff takes a list of paths. Without this, `black .` run at the root walked
# both planes — 103 files rather than 18 — and formatted the curation plane
# under `py312` instead of the `py314` its own `[tool.black]` declares. The two
# targets happen to produce identical output for this code today, which is
# exactly why nobody would notice the plane split had stopped holding for
# formatting while it still held for lint.
extend-exclude = "^/(arrt|arrt-player|contract)/"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["arrt", "arrt-player", "contract"]

[tool.ruff.lint]
# Mechanical rows from the project-preferences norm index, migrated from the
# Critic to lint rules so they are enforced rather than remembered:
#   E,F  pyflakes/pycodestyle — the unbound-name class of defect
#   I    import ordering
#   UP   modern syntax for the pinned target
#   B    bugbear — mutable defaults, shadowed loop vars
#   T20  no print(); this project logs
#   TRY  no bare `raise Exception`, no swallowed context
# `N` and `BLE` since 2026-10-05 (the owner, at the Norm Health sweep); `N818` is
# ignored for the reason the planes give.
select = ["E", "F", "I", "UP", "B", "T20", "TRY", "N", "BLE"]
ignore = [
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# CI scripts, where stdout IS the interface. GitHub Actions reads
# `::error::...` lines off a step's standard output to raise annotations, so
# `print()` here is the mechanism rather than a substitute for logging — a
# logger writing to stderr would produce a job that fails with its reason
# invisible in the summary.
".github/scripts/*.py" = ["T20"]

# The hand-run operator tools are not here: each lives in its plane's `tools/`,
# whose `pyproject.toml` lets `print()` be their output.

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/repository.py` is shared by the guards in `tests/` and `tests/preferences/`.
pythonpath = ["tests"]
