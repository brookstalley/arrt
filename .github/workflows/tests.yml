# Lints, then sends every suite `.testament.toml` declares to testament's pool, on every
# pull request. GitHub's runner only lints and waits: the owner, 2026-11-18, "we should be
# using testament where possible and not doing heavy builds. we keep running out of github
# actions minutes" (`.prawduct/owner-rulings.md`). When the pool cannot answer, the job
# falls back, because an outage must not block every merge (ruling 4 of 2026-11-19).
#
# - All five suites, governance, curation, browser, player (the real-Player test: a real
#   Arrt Player against the server) and contract, run on the pool: `testament run` with no
#   `--suite`, so a suite added to the manifest is in CI the day it is added. `tests/test_default_suite_ci_scope.py` holds that, and that the skip guard
#   reads the report this run writes, with every declared suite required to run something.
# - The type check runs there too, once per change: the governance suite's
#   `tests/preferences/test_type_gate.py` runs mypy in `arrt/` and `contract/` with each
#   project's own configuration. Lint here installs only ruff and black.
# - Neither `--fresh` nor `--no-cache`, which testament suggests for a required merge
#   check: testament reuses a pass only when everything the test reads is byte-identical,
#   and a cold run is minutes more of this job's wait.
# - `--no-fallback`: testament's own local fallback would run the suites through the client
#   on this runner, a different test from the pool's and the project's. The fallback here
#   is ours, and narrow (`.github/scripts/pool_or_fallback.py`):
#   - Only when the pool could not answer: the console would not serve the client (no
#     connection, a 5xx, a 408 or 429), `testament run` ended `verdict: unavailable`,
#     exit 75, or the pool did not accept the run within two minutes. Each is retried with
#     backoff for up to ten minutes first. A run the pool accepted and still holds at the
#     pool step's twenty-minute deadline is stopped and falls back too. A `failed` verdict
#     is a result, never retried and never sent to the fallback: a second run that passed
#     would hide the failure. A refused key, a wrong address or a wheel that fails its
#     digest is not an outage: nothing runs and the job fails.
#   - It runs lint (already done, above) and, directly with uv, every suite that needs no
#     labelled runner and is not the pool's alone: governance, curation and contract, each
#     by the manifest's own command and selection (`pool_or_fallback.py fallback`). Not
#     the browser suite, which needs Chrome and is the heavy one, nor the real-Player
#     suite, the pool's alone by the owner's ruling of 2026-11-20 ("We are almost out of
#     ci minutes"). That is the trade with the 2026-11-18 ruling: minutes are spent on
#     suites only during an outage. `tests/test_ci_fallback.py` holds both.
#   - The required check, "Lint, then every suite", is then green on what ran, so an
#     outage blocks no merge. The second job, "The browser suite ran on the pool", is not
#     required: it is green when the pool gave the verdict and red after a fallback, the
#     machine-readable mark that the tree has no browser or real-Player verdict. Nothing
#     else gives it one later: no workflow runs on a push to `develop` or `main`. To get
#     one, re-run all jobs once the pool is back, or run both suites on the pool by hand
#     (`docs/testing.md` § The browser suite).
# - Every step has a ceiling, and the ceilings add up to no more than the job's, so a hung
#   pool leaves the fallback, the guard and the summary their time. `tests/test_ci_fallback.py`
#   holds the sums against the driver's deadline.
# - The key is the `TESTAMENT_KEY` secret (the CI client key `arrt-ci-github`). The
#   coordinator and the console are the `TESTAMENT_COORDINATOR` and `TESTAMENT_CONSOLE`
#   repository variables, which keeps both addresses out of this public repository. A pull
#   request from a fork gets no secrets, so its job ends "nothing ran" and says why.
# - The client is installed from the pool's own console (`testament guide client`, "In
#   CI"), so it is the version the pool runs and the CI key is the only credential.
# - Not on a push to `main` or `develop`: the pull request already ran this on the tree it
#   merges. The drift-freshness check, which only makes sense on `main`, has its own file.
# - The server image's test target is `image.yml`, and runs only on a pull request into
#   `main` and by hand: this workflow builds no image (build-plan-audit-wave-2b, Chunk 56).
#   What the image caught that nothing else did, a test reading a file the image does not
#   carry, is the governance suite's `tests/test_the_image_carries_what_tests_read.py`, so
#   it runs here, on the pool, on every pull request.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to a pull request makes its older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool:
    # This name is the check branch protection requires (Chunk 22 of build-plan-audit-wave-2).
    name: "Lint, then every suite"
    runs-on: ubuntu-latest
    # The sum of the steps' ceilings below. A healthy run takes about ten minutes.
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pool.outputs.mode }}
    # Outputs go under the runner's temp directory, never the checkout: the client sends the
    # worktree's untracked files with the run, so a wheel or a report written there would
    # travel to the pool.
    env:
      OUT_DIR: testament
    steps:
      # Full history: the client sends the worktree as a commit, whose objects it walks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        timeout-minutes: 2
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Lint and format, the governance suite, the server and the contract
        id: lint
        timeout-minutes: 5
        # Before the pool run, so a lint failure costs seconds, not a pool run. One command
        # a line: under `bash -e` a failure that is not the last command of an `a && b`
        # list does not end the step. `--only-group dev` installs ruff and black, not each
        # project's runtime dependencies. No mypy here: it reads the types of everything
        # the code imports, so it needs the whole runtime installed, and it runs once per
        # change on the pool instead (the governance suite's type gate).
        run: |
          set -euo pipefail
          lint="uv run --frozen --only-group dev"
          $lint ruff check .
          $lint black --check .
          cd arrt
          $lint ruff check .
          $lint black --check .
          cd ../contract
          $lint ruff check .
          $lint black --check .
      - name: Every suite on the pool, retrying for ten minutes while it cannot answer
        id: pool
        # Two minutes past the driver's own twenty-minute deadline, which stops the client
        # itself and records why; this ceiling is only for the driver hanging.
        timeout-minutes: 22
        # `pool_or_fallback.py` installs the client from the console, runs the line after
        # `--`, and decides: `mode=pool` (a verdict; a `failed` one ends the step red and is
        # never retried), `mode=fallback` (the pool could not answer for ten minutes, or held
        # an accepted run to the deadline: the steps below run here), or `mode=none` (nothing
        # ran: no key, a refused key, a bad wheel, an ending the contract does not name). It
        # writes `decision.json` before its first attempt and after each, which the guard and
        # the summary read. `tests/test_ci_fallback.py` holds the decision against recorded
        # envelopes.
        env:
          TESTAMENT_KEY: ${{ secrets.TESTAMENT_KEY }}
          TESTAMENT_CONSOLE: ${{ vars.TESTAMENT_CONSOLE }}
          TESTAMENT_COORDINATOR: ${{ vars.TESTAMENT_COORDINATOR }}
          TESTAMENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py pool --out "$OUT" -- testament run --json=summary --junit-xml "$OUT/all.xml" --no-fallback
      # The fallback: only after `mode=fallback`, never after a verdict. One step for each
      # suite `.testament.toml` declares with no `requires` and not in the driver's
      # `POOL_ONLY` (the real-Player suite is the pool's alone), so each has its own ceiling.
      # A step names its suite and nothing else: `pool_or_fallback.py fallback` runs the
      # manifest's own command and selection for it here, with uv and without testament,
      # less the manifest's `-n 0` (the project's addopts parallelise here), and writes the
      # report named for the suite, which the guard and the summary read. A change to a
      # suite's selection reaches this job with no edit here; a suite added to the manifest
      # needs a step here, or `tests/test_ci_fallback.py` and the guard below fail.
      # `!cancelled()` so one red suite does not hide the next. A step that runs to its
      # ceiling writes no report, and the guard and the summary name it.
      - name: "Fallback: the governance suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        timeout-minutes: 10
        # The driver syncs `arrt/` and `contract/` with their dev groups first: the type gate
        # in this suite runs mypy there without syncing (`FALLBACK_SETUP`).
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py fallback --out "$OUT" --suite governance
      - name: "Fallback: the curation suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        timeout-minutes: 15
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py fallback --out "$OUT" --suite curation
      - name: "Fallback: the contract suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        timeout-minutes: 5
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py fallback --out "$OUT" --suite contract
      - name: Fail if nothing actually ran
        # A suite that skipped itself reports green. This reads the record of where the suites
        # ran and the reports they wrote, and fails on any skip that is not an expected
        # failure, on a suite that ran nothing, and on a fallback the record does not earn.
        # It does not fail on a failed test: after a fallback it passes over a report that
        # holds one (seen when Chunk 52 was integrated). What turns the job red then is the
        # fallback step's own exit code, so no fallback step, nor the pool step nor this one,
        # may carry `continue-on-error` or swallow its code (`tests/test_ci_fallback.py`).
        if: always()
        timeout-minutes: 1
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/assert_tests_ran.py "$OUT/all.xml" --suites-from .testament.toml --decision "$OUT/decision.json"
      - name: Summarize
        # Opens with one of three lines: ran on the pool; the pool was unavailable and this
        # ran here without the browser suite; nothing ran.
        if: always()
        timeout-minutes: 1
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py summary --out "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 2
        # For people; the verdict never depends on it, so an artifact service that is down
        # must not fail the job.
        continue-on-error: true
        with:
          name: testament-envelope
          path: |
            ${{ runner.temp }}/${{ env.OUT_DIR }}/envelope*.json
            ${{ runner.temp }}/${{ env.OUT_DIR }}/decision.json
            ${{ runner.temp }}/${{ env.OUT_DIR }}/all.xml
            ${{ runner.temp }}/${{ env.OUT_DIR }}/fallback/*.xml
          if-no-files-found: ignore

  browser:
    # Not a required check, and must never be made one: an outage of the pool must not
    # block a merge (ruling 4 of 2026-11-19). Green when the pool gave the verdict, so the
    # browser suite ran; red after a fallback, with how to get the browser's verdict. With
    # no `if`, it is skipped when the first job failed or was cancelled, never green.
    # `tests/test_ci_fallback.py` runs its step on each mode.
    name: "The browser suite ran on the pool"
    needs: pool
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Say whether the browser suite has a verdict for this tree
        env:
          POOL_MODE: ${{ needs.pool.outputs.mode }}
        run: python3 .github/scripts/pool_or_fallback.py browser-verdict
