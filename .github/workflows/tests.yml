# Lints, then sends every suite `.testament.toml` declares to testament's pool, on every
# pull request. GitHub's runner only lints and waits: the owner, 2026-11-18, "we should be
# using testament where possible and not doing heavy builds. we keep running out of github
# actions minutes" (`.prawduct/owner-rulings.md`). When the pool cannot answer, the job
# falls back, because an outage must not block every merge (ruling 4 of 2026-11-19).
#
# - All four suites, governance, curation, browser and contract, run on the pool:
#   `testament run` with no `--suite`, so a suite added to the manifest is in CI the day it
#   is added. `tests/test_default_suite_ci_scope.py` holds that, and that the skip guard
#   reads the report this run writes, with every declared suite required to run something.
# - Neither `--fresh` nor `--no-cache`, which testament suggests for a required merge
#   check: testament reuses a pass only when everything the test reads is byte-identical,
#   and a cold run is minutes more of this job's wait.
# - `--no-fallback`: testament's own local fallback would run the suites through the client
#   on this runner, a different test from the pool's and the project's. The fallback here
#   is ours, and narrow (`.github/scripts/pool_or_fallback.py`):
#   - Only when the pool could not answer: the console would not serve the client (no
#     connection, a 5xx, a 408 or 429), or `testament run` ended `verdict: unavailable`,
#     exit 75. Either is retried with backoff for up to ten minutes first. A `failed`
#     verdict is a result, never retried and never sent to the fallback: a second run that
#     passed would hide the failure. A refused key, a wrong address or a wheel that fails
#     its digest is not an outage: nothing runs and the job fails.
#   - It runs lint (already done, above) and, directly with uv, every suite that needs no
#     labelled runner: governance, curation and contract. Not the browser suite, which
#     needs Chrome and is the heavy one; the summary says it did not run, and someone runs
#     it on the pool before merging. That is the trade with the 2026-11-18 ruling: minutes
#     are spent on suites only during an outage. `tests/test_ci_fallback.py` holds both.
# - The key is the `TESTAMENT_KEY` secret (the CI client key `arrt-ci-github`). The
#   coordinator and the console are the `TESTAMENT_COORDINATOR` and `TESTAMENT_CONSOLE`
#   repository variables, which keeps both addresses out of this public repository. A pull
#   request from a fork gets no secrets, so its job ends "nothing ran" and says why.
# - The client is installed from the pool's own console (`testament guide client`, "In
#   CI"), so it is the version the pool runs and the CI key is the only credential.
# - Not on a push to `main` or `develop`: the pull request already ran this on the tree it
#   merges. The drift-freshness check, which only makes sense on `main`, has its own file.
# - The server image's test target is `image.yml`, and runs only when what the image is
#   built from changes.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to a pull request makes its older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool:
    # This name is the check branch protection requires (Chunk 22 of build-plan-audit-wave-2).
    name: "Lint, then every suite"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Outputs go under the runner's temp directory, never the checkout: the client sends the
    # worktree's untracked files with the run, so a wheel or a report written there would
    # travel to the pool.
    env:
      OUT_DIR: testament
    steps:
      # Full history: the client sends the worktree as a commit, whose objects it walks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Lint and format, the governance suite, the server and the contract
        # Before the pool run, so a lint failure costs seconds, not a pool run. One command
        # a line: under `bash -e` a failure that is not the last command of an `a && b`
        # list does not end the step. `--only-group dev` installs ruff and black, not each
        # project's runtime dependencies. mypy is the exception: it reads the types of what
        # the code imports, so it runs in the project's own environment (`uv run --frozen`).
        run: |
          set -euo pipefail
          lint="uv run --frozen --only-group dev"
          $lint ruff check .
          $lint black --check .
          cd arrt
          $lint ruff check .
          $lint black --check .
          uv run --frozen mypy
          cd ../contract
          $lint ruff check .
          $lint black --check .
          uv run --frozen mypy
      - name: Every suite on the pool, retrying for ten minutes while it cannot answer
        id: pool
        # `pool_or_fallback.py` installs the client from the console, runs the line after
        # `--`, and decides: `mode=pool` (a verdict; a `failed` one ends the step red and is
        # never retried), `mode=fallback` (the pool could not answer for ten minutes: the
        # steps below run here), or `mode=none` (nothing ran: no key, a refused key, a bad
        # wheel, an ending the contract does not name). It writes `decision.json`, which the
        # guard and the summary read. `tests/test_ci_fallback.py` holds the decision against
        # recorded envelopes.
        env:
          TESTAMENT_KEY: ${{ secrets.TESTAMENT_KEY }}
          TESTAMENT_CONSOLE: ${{ vars.TESTAMENT_CONSOLE }}
          TESTAMENT_COORDINATOR: ${{ vars.TESTAMENT_COORDINATOR }}
          TESTAMENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py pool --out "$OUT" -- testament run --json=summary --junit-xml "$OUT/all.xml" --no-fallback
      # The fallback: only after `mode=fallback`, never after a verdict. Each suite
      # `.testament.toml` declares with no `requires`, by the project's own command from
      # CLAUDE.md, scoped to the manifest's selection (a bare `cd arrt && uv run pytest`
      # collects the browser and live modules, whose skips the guard fails on) and writing a
      # report named for its suite. `!cancelled()` so one red suite does not hide the next.
      - name: "Fallback: the governance suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          uv run --frozen pytest tests -q -o junit_suite_name=governance --junitxml "$OUT/fallback/governance.xml"
      - name: "Fallback: the curation suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          cd arrt
          uv run --frozen pytest tests/unit tests/integration tests/contract tests/system tests/eval tests/test_scaffold.py -q -o junit_suite_name=curation --junitxml "$OUT/fallback/curation.xml"
      - name: "Fallback: the contract suite, here"
        if: ${{ !cancelled() && steps.pool.outputs.mode == 'fallback' }}
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          cd contract
          uv run --frozen pytest tests -q -o junit_suite_name=contract --junitxml "$OUT/fallback/contract.xml"
      - name: Fail if nothing actually ran
        # A suite that skipped itself reports green. This reads the record of where the suites
        # ran and the reports they wrote, and fails on any skip that is not an expected
        # failure, on a suite that ran nothing, and on a fallback the record does not earn.
        if: always()
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/assert_tests_ran.py "$OUT/all.xml" --suites-from .testament.toml --decision "$OUT/decision.json"
      - name: Summarize
        # Opens with one of three lines: ran on the pool; the pool was unavailable and this
        # ran here without the browser suite; nothing ran.
        if: always()
        run: |
          OUT="$RUNNER_TEMP/$OUT_DIR"
          python3 .github/scripts/pool_or_fallback.py summary --out "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        # For people; the verdict never depends on it, so an artifact service that is down
        # must not fail the job.
        continue-on-error: true
        with:
          name: testament-envelope
          path: |
            ${{ runner.temp }}/${{ env.OUT_DIR }}/envelope*.json
            ${{ runner.temp }}/${{ env.OUT_DIR }}/decision.json
            ${{ runner.temp }}/${{ env.OUT_DIR }}/all.xml
            ${{ runner.temp }}/${{ env.OUT_DIR }}/fallback/*.xml
          if-no-files-found: ignore
