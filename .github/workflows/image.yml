# Builds the server image's test target, and meets the built app image with a real Arrt
# Player: on a pull request into `main` (a release, at most weekly) and by hand
# (`workflow_dispatch`). Never on an ordinary pull request.
#
# The NAS runs `arrt/Dockerfile`'s app stage, and its `test` stage runs the server's suite
# inside that same image, so an image that installs, lays out or permissions something
# differently from the pool's environment is caught before deploy. It is a Docker build of
# about seven runner-minutes (pull request 446). The owner, 2026-11-20
# (`.prawduct/owner-rulings.md`): "We should minimize CI and prioritize local tests. We are
# almost out of ci minutes." So it does not run on a pull request into `develop`, not even
# one that changes the Dockerfile or a lockfile.
#
# The pool runs the same stage too, since the owner granted this project the host executor
# (2026-11-20, `.prawduct/owner-rulings.md`): the `image` suite in `.testament.toml`,
# run from a machine doing the work, never by CI,
# whose key holds no owner secret (`docs/testing.md` § The image's test stage on the pool).
# This workflow stays the release's own build of it, and the only place the built app image
# meets a real Arrt Player.
#
# What that leaves to a pull request into `main`, or to the `image` suite when someone runs
# it, stated, since an ordinary pull request no longer builds the image:
# - the one class the image caught that nothing else did, a test reading a file the image
#   does not carry (four tests reading `.env.example`, and one reading
#   `docs/source-plugins.md`), is held on every pull request by a root test instead,
#   `tests/test_the_image_carries_what_tests_read.py`, which reads the test stage's COPY
#   lines against every path the server's tests and tools build from their own location;
# - the rest is found here, at the release, or by a run by hand on the branch
#   (`gh workflow run image.yml --ref <branch>`): a Dockerfile, lockfile or interpreter
#   change that no longer builds or installs; a test that holds only as the checkout's
#   owner (the stage runs as the app's unprivileged user, over files it does not own); a
#   test that needs git or the network (the stage has neither); and the image's own pins.
#   Run it by hand on a branch that changes `arrt/Dockerfile` or a lockfile.
#
# `tests/test_default_suite_ci_scope.py` holds the triggers, and that no workflow an
# ordinary pull request runs builds an image.
name: Server image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: "The server image's test target"
    # Builds the test stage, so a red suite fails the build, and reads its report as
    # the other suites' reports are read, so a skip fails it too. A test layer served
    # from the cache is one whose code, tests and lockfile are byte-identical to a
    # build that already passed.
    #
    # amd64, on an amd64 runner: dezoomify-rs ships only an x86_64 binary, so
    # the image is amd64-only, and here it builds without emulation.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the test stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: arrt
          # The test stage reads `contract/`, the player-contract artifact, the
          # 2024 index, `.env.example` and the plugin guide from the repository root
          # (the Dockerfile says why).
          build-contexts: repo=.
          target: test-report
          platforms: linux/amd64
          outputs: type=local,dest=image-report
          # `max`, every stage's layers: the target is the report stage, built
          # from scratch, so `min` would keep only the report and every run
          # would rebuild Python and both environments. The dependency layers
          # change only with the lockfile, so most runs reuse them.
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Fail if nothing actually ran
        if: always()
        run: python3 .github/scripts/assert_tests_ran.py image-report/results.xml

  player:
    name: "The built image against a real Arrt Player"
    # The app stage, built as the NAS runs it, with a real Arrt Player pointed at it:
    # `arrt/tests/system/test_a_real_player.py` with `ARRT_SERVER_IMAGE` naming the image,
    # so the server is the image, run over the test's art root mounted at `/art`, and the
    # Player is the commit `arrt/tests/system/player-ref.txt` names, installed from GitHub.
    # The test stage cannot do this (no git, no network: the Dockerfile says so), and the
    # pool runs the same test against `python -m arrt` from the checkout, not the image.
    #
    # On a pull request into `main` only, and by hand: a release, at most weekly, so the
    # shipped image meets a real Player once a release, inside the owner's ruling on
    # minutes (2026-11-18). This job is proven only by such a pull request.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the app stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: arrt
          build-contexts: repo=.
          target: app
          platforms: linux/amd64
          load: true
          tags: arrt:player-e2e
          # Read from the image job's cache, never written: the dependency layers are
          # the ones that job keeps, and a second writer to its scope would evict them.
          cache-from: type=gha,scope=server-image
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.32"
          enable-cache: true
      - name: The server's test environment
        working-directory: arrt
        run: uv sync --frozen
      - name: A real Arrt Player against the built image
        working-directory: arrt
        env:
          ARRT_SERVER_IMAGE: arrt:player-e2e
        # `-m player_e2e` because the addopts deselect it; `-n0` because it is one test of
        # two processes; the path scoped, as every CI pytest line is.
        run: uv run --frozen pytest tests/system/test_a_real_player.py -m player_e2e -n0 -q -p no:cacheprovider -o junit_suite_name=player --junitxml ../player-report/results.xml
      - name: Fail if nothing actually ran
        if: always()
        run: python3 .github/scripts/assert_tests_ran.py player-report/results.xml
