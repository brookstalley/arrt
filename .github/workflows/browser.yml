# Run the browser suite, which is the only thing that executes the client.
#
# WHAT THIS IS FOR. `arrt/src/arrt/http/static/app.js` is the product's
# only human interface, and neither Python suite runs a line of it. This suite
# drives it in a real Chromium against a real booted server. Unlike the API-drift
# probes, it is about whether our own code is right — so it runs on every pull
# request and on pushes to `main`, where a regression is caught by the change that
# caused it. Not on every push to every branch: `pull_request` already fires on
# each push to a PR head, so the wider trigger would only double the runs.
#
# WHY IT IS NOT IN THE DEFAULT SUITE. It needs a ~200MB browser, which is too
# much to impose on `uv sync` for someone who only wants to run the tests. That
# makes it a packaging decision rather than a statement about the tests: they are
# deterministic, they reach no foreign API, they spend nothing, and they gate as
# hard as anything else wherever the browser is installed. The `browser` marker
# is what keeps them off the default run, and this file is what makes sure being
# off the default run does not mean never running.
#
# -n0 is REQUIRED, not tidiness. `-n auto` is in the default `addopts`, and a
# `-m` on the command line replaces the marker expression while leaving the
# parallelism in place. Browser tests time real poll intervals, and workers
# contending for cores turn those windows into flakes.
#
# SHARDED, SO SERIAL DOES NOT MEAN SLOW (the owner, 2026-10-06: one serial job
# took about ten minutes on every PR). Four jobs run side by side, each serial on
# a share of the files that `.github/scripts/browser_shard.py` computes from the
# directory, balanced by test count; `tests/test_browser_shards.py` holds that
# every file is in exactly one share at the count below.
#
# A PULL REQUEST THAT CHANGES ONLY RECORDS SKIPS IT: Markdown, `.prawduct/` and
# `docs/` cannot change what the client does, and no browser test reads them.
# A push to `main` always runs it.

name: Browser suite

on:
  push:
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "**.md"
      - ".prawduct/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: "The client, in a real browser (${{ matrix.shard }} of 4)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard failing must not cancel the others: each names its own failures.
      fail-fast: false
      matrix:
        # The count is in three places that must agree: here, in the job's name
        # above and in the shard step's argument below. The root suite's
        # `tests/test_browser_shards.py` reads all three.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the browser group
        working-directory: arrt
        run: uv sync --group browser
      - name: Install Chromium
        working-directory: arrt
        # Only the one browser. The suite pins behaviour of the client, not of
        # any particular engine's rendering, so paying for three downloads would
        # buy a longer job and no extra information.
        run: uv run playwright install --with-deps chromium
      - name: Run the browser suite
        working-directory: arrt
        # The path is scoped as well as the marker, and that is load-bearing
        # rather than tidy. `-m browser` alone still *collects* the whole tests
        # tree, so the eval module — whose group is deliberately not installed
        # here — lands an import skip in the report, and the guard below reads any
        # skip as a provisioning failure and fails the job. Verified: unscoped,
        # this step reported "18 passed, 1 skipped" and the guard exited 1.
        run: |
          files=$(python3 ../.github/scripts/browser_shard.py tests/browser 4 $(( ${{ matrix.shard }} - 1 )))
          echo "Shard ${{ matrix.shard }} of 4 runs: $files"
          uv run pytest $files -m browser -n0 -v --junitxml=results.xml
      - name: Fail if nothing actually ran
        if: always()
        # A suite that skipped itself reports green, and green-because-absent is
        # indistinguishable from green-because-passing in the checks list. This
        # is the guard that tells the two apart, and it is exactly why the
        # modules skip rather than fail when the group is missing: that is the
        # right behaviour locally and a trap here.
        run: python3 .github/scripts/assert_tests_ran.py arrt/results.xml
