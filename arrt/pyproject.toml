[project]
name = "arrt"
version = "0.3.0"
description = "Curation plane — discovery, acquisition, catalogue, and the MCP + HTTP surfaces."
# Nothing in the default install requires 3.14. This floor used to be held by
# `3tears-models`, which declares the same one — but that package was confined to
# the opt-in `eval` group on 2026-08-02 (see the group below), so the only
# declared holder of the floor is now a test-only dependency. What still supports
# it is weaker and worth stating plainly: the whole declared set was verified to
# resolve and import on CPython 3.14.4 (2026-07-27), and nothing has asked for a
# lower one. Lowering it is therefore a decision available to whoever needs it,
# not a correction — but check the `eval` group still resolves before doing so.
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    # Imported directly by the ASGI app for its request types. It arrives
    # transitively via fastapi, but the declared set has to describe what the
    # code imports — fastapi is free to change how it vendors starlette.
    "starlette",
    # Plain, not `[standard]`. That extra pulls httptools, uvloop, watchfiles,
    # websockets and pyyaml — none imported by any module here, and the same
    # ground on which pydantic and httpx were kept out below. It also carried a
    # reload watcher this plane never starts and a websocket implementation the
    # MCP transport does not use, while silently deciding the HTTP parser for an
    # always-on-but-idle plane on a Pi. Dropped 2026-08-01; add it back with the
    # named component and the measurement that wanted it.
    "uvicorn",
    # The floor is the version this code is actually verified against, not the
    # one the design was first written for. `app.py` passes `session_idle_timeout`
    # to `StreamableHTTPSessionManager`, and that parameter is confirmed present
    # here and nowhere earlier — a resolve below it raises TypeError while the
    # application is being built, so every request fails and the plane never
    # serves. The old `>=1.27` was a claim nobody had checked.
    "mcp>=1.28.1",
    "python-dotenv",
    # The typed response models the HTTP API returns. It resolves transitively
    # via mcp, but this code imports it directly now, and the rule below cuts
    # both ways: what the code imports belongs in this list.
    "pydantic",
    # Thumbnails. Arrived ahead of the acquisition work below because a grid of
    # 4K renditions is not a page and nothing in the standard library decodes a
    # JPEG — `seed/images.py` reads the SOF header for dimensions precisely
    # because that needed no decoder, and downscaling does.
    "pillow",
    # The OpenRouter client's transport — the one thing in this plane that talks
    # to a foreign API. Declared 2026-08-02 when that client landed: it resolves
    # transitively through mcp today, so an undeclared install happens to work,
    # and the day mcp vendors or drops it `__main__` fails at *import* and the
    # whole plane stops serving rather than just discovery.
    "httpx",
]

# 3tears core is deliberately absent and is not expected. The catalogue's durable
# tier is first-party code matching that framework's DurableStore contract
# structurally, so no framework code is imported and there is nothing to resolve;
# its L1 tier is an in-memory cache that would not have persisted the catalogue
# anyway. Recorded in full at project-state.yaml -> technical_decisions.technology.
#
# Confined to the opt-in `eval` group, where it is pinned (see below):
#   3tears-models — the operator's own multi-provider model adapters. This used to
#     say it "arrives with the discovery work that calls it" and sat in the list
#     below as not-yet-pinned; that was reversed on 2026-08-02 and it is pinned in
#     `eval` today, so it belongs here rather than there. The discovery engine
#     talks to OpenRouter through a first-party client behind a narrow seam
#     instead: all traffic goes to one provider (search included, via its web
#     plugin), and this package would pull 3tears-observe, 3tears-media-contracts,
#     anthropic, langchain-anthropic/openai/openrouter and jsonschema into the
#     DEFAULT install — the plane that runs on the Pi beside display under a
#     MemoryMax. Not a rejection: the seam makes adopting it a one-file change if
#     a second provider ever earns it. Reasoning in `openrouter-api-findings.md`.
#
# Deliberately not pinned yet:
#   (opencv-python-headless, scikit-image and numpy were forecast here for
#     "acquisition and the mat engine". Both landed 2026-08-03 and neither needed
#     any of the three, so this is a rejection now rather than a deferral. The
#     mat engine's CIE LAB conversion and CIEDE2000 distance are thirty lines of
#     fully-specified arithmetic in `library/acquisition/color.py`, verified against the
#     published Sharma reference set; the dominant-colour fallback uses Pillow's
#     median-cut quantiser where 2024 used OpenCV k-means. Three packages on a
#     memory-capped Pi, to do that, could not be argued for. Reinstate only with
#     the component that needs them named.)
#   (httpx was here until 2026-08-02 on the grounds that only the mcp *client*
#     used it. The OpenRouter client imports it directly now, so it moved into
#     the declared set above — see the note beside it there.)

# The source plugins this distribution provides. Registered exactly as a plugin
# from outside this repository would be, so the wiring imports neither by name and
# these are the proof that the loader works (`source-plugins.md` § Loading).
# A new entry here is read only after the project is installed again (`uv sync`).
[project.entry-points."arrt.sources"]
commons = "arrt.library.sources.commons:PLUGIN"
artic = "arrt.library.sources.artic:PLUGIN"
wikidata = "arrt.library.sources.wikidata:PLUGIN"
met = "arrt.library.sources.met:PLUGIN"
smk = "arrt.library.sources.smk:PLUGIN"
navigart = "arrt.library.sources.navigart:PLUGIN"

[dependency-groups]
# httpx appears here *and* in `[project].dependencies`, deliberately. It is a
# runtime import (the OpenRouter client's transport — see the note beside it
# above) and the browser-surface tests also drive a booted server with it, so it
# is pinned into `dev` for the test-only install path as well.
#
# **This comment argued the opposite until 2026-08-02**, when the client landed
# and made "no first-party module imports it" false. Left as a correction rather
# than deleted because the surviving version was actively dangerous: this file's
# rule is that the declared set describes what the code imports, so a maintainer
# applying the old comment would have removed httpx from the runtime list and put
# the whole plane one `mcp` release away from failing at import.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # **The Player contract's schemas are checked with this**, against real
    # documents, so the contract under contract/ is tested rather than trusted.
    # Declared rather than inherited, because an indirect copy disappears the
    # day the package that brings it changes its own dependencies.
    "jsonschema>=4.23",
    # The suite has no hotspot — ~1,750 tests at roughly 67ms mean, the slowest
    # single one 1.4s — and most of the total is integration tests booting a real
    # uvicorn per class and waiting on it. That wait is exactly what
    # parallelises, and it is a wait this repo will not remove the other way: an
    # in-process ASGI transport would skip the mounted MCP lifespan and pass
    # against an app that fails every real request.
    #
    # Measured 2026-08-05: **118s serial, 21s under `-n auto`.**
    #
    # It does NOT speed up a narrow `tools/mutation_sweep.py` run, and that was
    # worth measuring rather than assuming, because the sweep is the obvious
    # thing to expect a win on. The same ten-mutation sweep over two test files
    # took 67s serial and 65s parallel: a small slice is dominated by per-run
    # worker startup, which parallelism adds rather than removes. The win arrives
    # when a sweep targets a broad slice, where each run pays the full-suite cost
    # the `(mutations + 1) x suite time` budget is written against.
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "black>=24",
    "httpx",
    # Same reasoning as httpx directly above, and it belongs in `dev` rather
    # than `eval` for a reason worth stating: the evaluation driver imports
    # `langchain_core.messages` directly, and the tests that prove that driver
    # works are deterministic, free, and reach no provider. Declaring it only in
    # `eval` left them skipping in the canonical suite — the one CI and the
    # gates actually run — so the guards on hand-written harness code were green
    # without ever executing. It arrives transitively via 3tears-models too, but
    # that edge is an alpha package's transitive detail and this code imports
    # the package by name.
    #
    # Bare, like httpx and pydantic above it. A `>=0.3` floor was written here
    # first and removed: nothing verified it, `uv.lock` resolves 1.5.3, and this
    # repo's own learning is that a declared floor is a claim — the samsungtvws
    # move proved that the hard way when a library's own `websockets>=10.2`
    # resolved fine and could not import. An unverified number is worse than no
    # number, because the next reader takes it for evidence.
    "langchain-core",
]
# Its own group, because it is the heaviest thing this repo would install —
# langchain-anthropic, langchain-openai, langchain-openrouter and the anthropic
# SDK arrive with it — and only the *paid* half of the evaluation needs it. The
# free half runs on `dev` alone (see langchain-core above), so `uv run pytest`
# stays fast and offline while still executing every deterministic guard.
#
# Pinned below 0.23 on purpose: 3tears is alpha and its own README says the
# public API can shift between minor versions. `create_chat_model`'s signature
# was verified against 0.22.5 rather than read from the checkout on this
# machine, which was three minors behind and would not have been what installed.
eval = ["3tears-models>=0.22.5,<0.23"]
# Its own group for the same reason `eval` has one: it is a heavy install — the
# wheel is ~40MB and `playwright install chromium` fetches a browser of roughly
# 200MB on top — and no first-party module imports a line of it. Keeping it out
# of `dev` is what lets `uv sync` stay the cheap default it is for someone who
# only wants to run the suite.
#
# The bindings are Python rather than Node deliberately. The recorded decision
# accepted "a second language's package manifest inside arrt/" as a cost of
# covering the client at all; Playwright publishes first-party Python bindings,
# so that cost is simply not paid — and the harness reuses the suite's own
# server, catalogue and image fixtures instead of rebuilding each state through
# the HTTP API, which a Node harness would have had to do.
browser = ["pytest-playwright>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py314"]
line-length = 130

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
# Unlike the root project there is no legacy carve-out here: this plane is new
# code, and every rule below applies to all of it except where the per-file
# list names the test tree.
#
# **Every rule ruff has, less a short list each named with its reason** (the
# owner, 2026-10-05: "go big on ruff"). `ALL` brings the rules a ruff upgrade adds
# without anyone choosing them, which is the point: a rule is opted out of, with a
# reason here, never forgotten into. A site that is a deliberate exception carries
# a per-line `noqa` with its reason. The display plane carries the same list, so
# the two planes are held to one standard.
select = ["ALL"]
ignore = [
    # black owns layout, and these two fight it.
    "COM812",
    "ISC001",
    # Docstrings here are prose written for a reader, not a convention's sections.
    "D",
    # No copyright header: a public repository with one owner.
    "CPY",
    # An exception's message is a sentence composed where it is raised, for the
    # person who reads it; moving it into a variable first buys nothing here.
    "EM101",
    "EM102",
    "TRY003",
    # Prose (messages, docstrings, comments) uses typographic quotes and dashes on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
    # Settings flow in as keyword-only arguments, so a long signature is not a confusing one.
    "PLR0913",
    "PLR0917",
    # Lazy imports are deliberate: optional groups (`eval`, `browser`) are imported
    # only where they are used, and tests import the module under test late.
    "PLC0415",
    # Moving typing-only imports under `TYPE_CHECKING` is churn with no runtime gain at this size.
    "TC001",
    "TC002",
    "TC003",
    # `tools/` and `tests/` are directories of scripts and test modules, not packages.
    "INP001",
    # Exception class names are public and already read as errors; renaming them is API churn.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert with `assert`, name their expected numbers inline, take fixtures they
# do not read, reach into what they test, and pass flags positionally to helpers.
# Tests hold fake tokens and seeded randomness by design.
"tests/*" = ["ANN", "S101", "PLR2004", "ARG", "SLF001", "FBT", "S105", "S106", "S311"]
# `T201` is banned in `src/` because the server runs unattended, where a `print()`
# has no level and no timestamp. `tools/` is the inverse: run by hand at a
# terminal by a person waiting for the report the printing is (as the display
# plane's `tools/` carve-out says).
"tools/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A run's thread that fails after its test returned is a failure of that test's
# harness, not a warning about whichever test pytest happens to be in (#198). As
# an error it fails where it happened; as a warning it scrolled past while the
# suite stayed green. `run_threads` in `tests/conftest.py` is what keeps it quiet.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
    "llm_eval: drives the tool surface with a real model over OpenRouter. Costs money, needs OPENROUTER_API_KEY, and is not deterministic — deselected by default, run with `-m llm_eval`.",
    "live_api: re-verifies OpenRouter's recorded response shapes and prices against the live API. Costs money, needs OPENROUTER_API_KEY — deselected by default, run with `-m live_api`.",
    "live_museum: re-verifies a museum API's recorded response shapes against the live API. Costs nothing and needs no key — the museum APIs are open — but needs the network, so it is deselected by default. Run with `-m live_museum`.",
    "live_binary: drives the real dezoomify-rs against a live museum, checking the CLI behaviours the wrapper is written against. Costs nothing and needs no key, but needs the binary installed and the network. Deselected by default; run with `-m live_binary`.",
    "plugin_fault_expected: the test makes a source plugin fault on purpose, so the suite-wide guard that fails any test logging `source.plugin_fault` lets it pass.",
    "browser: drives the shipped browser client in a real Chromium against a real booted server. Costs nothing and reaches no foreign API, but needs the `browser` dependency group and a downloaded browser — deselected by default, run with `-m browser`.",
]
# All three live suites are off unless asked for, but for two different reasons
# and they are kept on separate markers because of it. `llm_eval` and `live_api`
# spend money. `live_museum` spends nothing — the museum APIs are open — and is
# deselected only because it needs the network, which a suite whose job is to be
# green cannot depend on.
#
# `browser` is off for a fourth reason, and it is neither of those: it spends
# nothing, reaches nothing foreign, and is entirely deterministic. What it needs
# is a ~200MB browser binary on the machine running it, which is too much to
# impose on a default `uv sync`. That makes its deselection a packaging decision
# rather than a statement about the tests — they gate exactly as hard as the rest
# of the suite wherever the browser is installed, and CI installs it.
#
# **Separate markers so that opting into the free one does not opt into the paid
# ones.** They shared `live_api` briefly, which meant the museum suite's own
# instruction to run `-m live_api` would also spend real credit whenever a key
# was in the environment — an invitation to spend money written in a file
# arguing the suite was free. A command-line `-m` overrides this line, which is
# how any of them is opted into.
#
# `-n auto` runs the suite across cores. It is safe here because the fixtures
# already isolate everything a worker could collide on — `tmp_path` per test, a
# fresh sqlite file per test, and a server that now lets uvicorn bind port 0 and
# reads the port back, which closed the one real race (claiming a port, closing
# it, and handing uvicorn the number leaves a window another worker can take).
# **Use `-n0` to debug a failure**: parallel workers interleave output and a
# `pdb` breakpoint has no terminal to stop in.
#
# **And `-n0` is REQUIRED for the live suites, not merely tidier.** A `-m` on the
# command line replaces the marker expression below and leaves `-n auto` in
# place, so `-m live_museum` alone fires concurrent requests at a public museum
# API — which reads back as a rate limit and is indistinguishable from the
# contract change the probe exists to detect. Run them as
# `uv run pytest -m live_museum -n0`. `.github/workflows/api-drift.yml` does the
# same and says so at each call site.
addopts = "-n auto -m 'not llm_eval and not live_api and not live_museum and not live_binary and not browser'"
