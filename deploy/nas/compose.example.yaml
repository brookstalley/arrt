# Arrt as a container app — the shape only.
#
# This repository is public, so the real file, with the house's addresses, ports,
# paths and env file, lives in the operator's private homelab repository and is
# applied from there (`build-plan-nas.md` Chunk 03). Everything in angle
# brackets is the house's to fill in.

services:
  arrt:
    # Built from a commit (`arrt/Dockerfile`) and pushed to the house's registry,
    # so a rollback is the previous tag.
    image: <registry>/arrt:<commit>
    restart: unless-stopped
    # The image runs as an unprivileged user; choose the one that owns the art
    # root on the host.
    user: "<uid>:<gid>"
    security_opt:
      - no-new-privileges:true
    # **Hardened, and measured** (`deploy/README.md`). The server needs no capability: it
    # binds a port above 1024 and writes only files its own user owns, so every
    # one is dropped. Its root filesystem is read-only, which is what makes the
    # list of places it writes a list the compose file holds: `/art`, `/backups`
    # and `/tmp`, each mounted below, and nothing else. A feature that starts
    # writing elsewhere fails here, loudly, rather than adding files to the image.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # SQLite spills a large sort to a temporary file. With the root read-only and
      # no `/tmp`, a sort of about twenty thousand rows (past its two-megabyte
      # cache) fails with "disk I/O error"; with this, a hundred thousand do not.
      # Memory, not disk, and it counts against `mem_limit`, so it is bounded.
      # Mode 1777 because the server's user is not root: a tmpfs is root's
      # otherwise.
      - /tmp:size=64m,mode=1777,noexec,nosuid
    # SIGTERM, then this long to stop its workers and close the catalogue
    # cleanly. A hard kill mid-write is what the grace period exists to avoid.
    stop_grace_period: 30s
    # The most the container may hold, `/tmp` above included: one large image in
    # memory at a time, with headroom. The kernel kills the container past it
    # and `restart` brings it back.
    mem_limit: 3g
    # **Bound to one address, never to every interface.** The server asks no one
    # who they are (`security-model.md` § Trust Boundary), and its host check admits
    # any IP address as the name asked for, so a port published on every NAS
    # interface is reachable by everything that can route to the NAS: a guest or IoT
    # network, a VPN. Publish it to the address only the reverse proxy reaches:
    # loopback when the proxy runs on this host, or the address on the network the
    # proxy shares with this container. Or publish nothing and put the proxy and
    # this container on one Docker network, which the proxy reaches by service name.
    ports:
      - "<address the proxy reaches, e.g. 127.0.0.1>:<host port>:8770"
    # Docker's default json-file driver keeps every line for ever. The server writes
    # a line per failure, run and refusal, and none per successful Player request
    # (`arrt/src/arrt/logs.py`); this bounds the rest at three files of ten
    # megabytes each, however busy the household is.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ART_ROOT: /art
      # The backup job writes generations here, daily and at start unless the newest
      # is younger than the interval; a copy taken before a migration that drops
      # anything goes here too (`pre-migration-<instant>.sqlite`, three kept).
      BACKUP_DIR: /backups
    # The keys and the house's settings (OPENROUTER_API_KEY,
    # WIKIDATA_USER_AGENT, ARTIC_USER_AGENT, CURATION_ALLOWED_HOSTS, …) — see
    # `.env.example`. CURATION_ALLOWED_HOSTS must name the reverse proxy's name
    # for the server, or the browser interface and MCP refuse it.
    env_file:
      - <path to arrt.env>
    volumes:
      # The catalogue, masters, renders and thumbnails.
      - <art root on the host>:/art
      # Where the backup job writes its generations: a different dataset from
      # the art root, so losing one does not lose the other.
      - <backup directory on the host>:/backups
    # No healthcheck here: the image's own probes /healthz on the port the
    # container is configured with, which a copy here would not follow.
